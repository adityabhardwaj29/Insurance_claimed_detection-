services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fraudshield-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=${DATABASE_URL:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-enterprise-fraudshield-ai-key-secret-2024}
    volumes:
      - ./data:/app/data
      - ./database:/app/database
      - ./models:/app/models
      - ./logs:/app/logs
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: fraudshield-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fraudshield-dashboard
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - PYTHONPATH=/app
    depends_on:
      - api
    volumes:
      - ./data:/app/data
      - ./database:/app/database
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
